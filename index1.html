<!DOCTYPE html><html><head><meta charset="utf-8"><title>Pediatric Nursing Ch1-3</title><style>body{font-family:Arial;margin:20px;background:#f5f9ff}h1{color:#0b5ed7}.card{background:#fff;padding:15px;margin:10px 0;border-radius:8px;box-shadow:0 1px 4px #ccc}button{padding:8px 12px;margin:4px}</style></head><body><h1>🩺 Pediatric Nursing Question Bank (Chapters 1-3)</h1><p>Physical Assessment, Growth Measurements, Vital Signs</p><div id=q class=card></div><script>const qs=[{t:'Physical Assessment',q:'Which skill involves listening to body sounds?',o:['Inspection','Palpation','Auscultation','Percussion'],a:2},{t:'Physical Assessment',q:'Normal capillary refill time is?',o:['1-2 sec','4 sec','6 sec','8 sec'],a:0},{t:'Physical Assessment',q:'Simian crease is associated with?',o:['Chromosomal abnormality','Asthma','Diabetes','Fracture'],a:0},{t:'Growth',q:'Head circumference is routinely measured under?',o:['12 months','24 months','36 months','5 years'],a:2},{t:'Growth',q:'BMI uses weight in?',o:['lb','kg','oz','g'],a:1},{t:'Growth',q:'Mid arm circumference assesses?',o:['Muscle mass','Vision','Hearing','Pulse'],a:0},{t:'Vital Signs',q:'Normal temperature range?',o:['34-35','36.5-37.5','38-39','40-41'],a:1},{t:'Vital Signs',q:'Apical pulse preferred for children younger than?',o:['1 year','2-3 years','6 years','10 years'],a:1},{t:'Vital Signs',q:'Respiration should be counted for?',o:['15 sec','20 sec','30 sec','1 full minute'],a:3}];let i=0,s=0;function show(){if(i>=qs.length){document.getElementById('q').innerHTML='<h2>Completed</h2><p>Score '+s+'/'+qs.length+'</p>';return;}let x=qs[i];let h='<h3>'+x.t+'</h3><p>'+x.q+'</p>';x.o.forEach((v,n)=>h+='<button onclick="ans('+n+')">'+v+'</button><br>');document.getElementById('q').innerHTML=h;}function ans(n){if(n==qs[i].a)s++;i++;show();}show();</script></body></html>
