<!DOCTYPE html><html><head><meta charset="utf-8"><title>Pediatric Nursing Chapters 8-10</title><style>body{font-family:Arial;background:#f4f8ff;margin:20px}h1{color:#0b5ed7}.card{background:white;padding:15px;border-radius:10px;box-shadow:0 1px 5px #ccc}button{margin:5px;padding:8px 12px}</style></head><body><h1>💉🫁🔄 Pediatric Nursing Question Bank (Chapters 8-10)</h1><p>Intravenous Therapy • Oxygen Therapy • Transanal Irrigation</p><div id="quiz" class="card"></div><script>
const qs=[
{t:'IV Therapy',q:'For a child weighing 8 kg, maintenance fluid is?',o:['50 mL/kg/day','75 mL/kg/day','100 mL/kg/day','150 mL/kg/day'],a:2},

{t:'IV Therapy',q:'Blood transfusion should be completed within?',o:['1 hour','2 hours','4 hours','8 hours'],a:2},
{t:'IV Therapy',q:'First action if transfusion reaction is suspected?',o:['Increase rate','Stop transfusion','Remove IV','Give food'],a:1},
{t:'Oxygen Therapy',q:'Preferred oxygen device for neonates and infants requiring maximum oxygenation?',o:['Nasal cannula','Venturi mask','Oxygen hood','Room air'],a:2},
{t:'Oxygen Therapy',q:'Normal oxygen hood flow rate is?',o:['1-2 L/min','5-15 L/min','20-25 L/min','30 L/min'],a:1},
{t:'Oxygen Therapy',q:'A complication of prolonged oxygen therapy is?',o:['ROP','Hypertension','Hypoglycemia','Anemia'],a:0},
